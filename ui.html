<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Design vs UI Diff</title>
<style>
  :root {
    --bg: var(--figma-color-bg, #fff);
    --bg2: var(--figma-color-bg-secondary, #f5f5f5);
    --fg: var(--figma-color-text, #222);
    --fg2: var(--figma-color-text-secondary, #777);
    --bd: var(--figma-color-border, #ddd);
    --accent: var(--figma-color-bg-brand, #0d99ff);
    --danger: #ff2d55;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 10px 12px 16px; background: var(--bg); color: var(--fg);
         font: 11px/1.4 Inter, system-ui, sans-serif; }
  h3 { margin: 12px 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase;
       letter-spacing: .04em; color: var(--fg2); }
  h3:first-child { margin-top: 0; }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .row > label { flex: 1; display: flex; flex-direction: column; gap: 2px; color: var(--fg2); }
  .row > label.inline { flex-direction: row; align-items: center; gap: 6px; color: var(--fg); }
  input[type=text], input[type=number], select {
    width: 100%; height: 26px; padding: 0 6px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--bd); border-radius: 4px; font: inherit; }
  input[type=number] { width: 100%; }
  button { height: 26px; padding: 0 10px; border: 1px solid var(--bd); border-radius: 4px;
           background: var(--bg); color: var(--fg); font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--bg2); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff;
                   width: 100%; height: 30px; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
  button.tab.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .card { padding: 6px 8px; background: var(--bg2); border-radius: 4px; margin-bottom: 6px; }
  .muted { color: var(--fg2); }
  #drop { border: 1px dashed var(--bd); border-radius: 4px; padding: 14px 8px; text-align: center;
          color: var(--fg2); cursor: pointer; }
  #drop.over { border-color: var(--accent); background: var(--bg2); }
  #thumbRow { display: none; gap: 8px; align-items: center; }
  #thumb { height: 56px; max-width: 80px; object-fit: contain; border: 1px solid var(--bd); border-radius: 3px; }
  details { border: 1px solid var(--bd); border-radius: 4px; padding: 4px 8px; margin: 10px 0; }
  details summary { cursor: pointer; font-weight: 600; color: var(--fg2); text-transform: uppercase;
                    font-size: 11px; letter-spacing: .04em; }
  details[open] summary { margin-bottom: 6px; }
  #status { min-height: 16px; margin: 6px 0; color: var(--fg2); }
  #status.err { color: var(--danger); }
  .warn { color: #b26a00; margin-top: 2px; }
  #previewWrap { width: 100%; border: 1px solid var(--bd); border-radius: 4px; overflow: hidden;
                 background: #fff; margin: 6px 0; }
  #preview { display: block; width: 100%; }
  #regions { max-height: 180px; overflow: auto; border: 1px solid var(--bd); border-radius: 4px; }
  .reg { padding: 4px 8px; border-bottom: 1px solid var(--bd); cursor: pointer; display: flex;
         align-items: center; gap: 6px; }
  .reg .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reg .ig { height: 20px; padding: 0 6px; font-size: 10px; flex: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.size { background: #0d99ff; }
  .dot.icon { background: #ff2d55; }
  .dot.content { background: #ff2d55; }
  .dot.spacing { background: #af52de; }
  #ignored { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 4px 1px 8px; border-radius: 10px;
          background: var(--bg2); border: 1px solid var(--bd); max-width: 160px; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip button { height: 16px; width: 16px; padding: 0; border: 0; border-radius: 50%; line-height: 1; }
  .reg:last-child { border-bottom: 0; }
  .reg:hover { background: var(--bg2); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<h3>Target node</h3>
<div class="card" id="nodeInfo">Select a frame</div>
<div class="row">
  <input type="text" id="nodeIdIn" placeholder="Node ID or link">
  <button id="useBtn" style="flex:none">Use</button>
</div>

<h3>Screenshot</h3>
<div id="drop">Drop, click or paste image</div>
<input type="file" id="file" accept="image/*" class="hidden">
<div id="thumbRow" class="row">
  <img id="thumb" alt="">
  <div style="flex:1"><div id="shotInfo"></div></div>
  <button id="replaceBtn">Replace</button>
</div>

<h3>Crop (system bars, pt)</h3>
<div class="row">
  <label>Status bar<input type="number" id="statusPt" min="0" step="1" value="47"></label>
  <label>Nav bar<input type="number" id="navPt" min="0" step="1" value="34"></label>
  <label>Preset
    <select id="preset">
      <option value="custom">Custom</option>
      <option value="47,34" selected>iOS (notch) 47/34</option>
      <option value="54,34">iOS (Dynamic Island) 54/34</option>
      <option value="24,24">Android (gesture) 24/24</option>
      <option value="24,48">Android (3-button) 24/48</option>
      <option value="0,0">None 0/0</option>
    </select>
  </label>
</div>
<div class="row"><label class="inline"><input type="checkbox" id="dContains" checked> Design contains system bars</label></div>
<div class="row hidden" id="dCropRow">
  <label>Design top<input type="number" id="dTop" min="0" step="1" value="0"></label>
  <label>Design bottom<input type="number" id="dBot" min="0" step="1" value="0"></label>
</div>

<details>
  <summary>Settings</summary>
  <div class="row">
    <label>Threshold (0-1)<input type="number" id="threshold" min="0" max="1" step="0.01" value="0.1"></label>
  </div>
  <div class="row">
    <label>Export scale
      <select id="scale"><option>1</option><option selected>2</option><option>3</option></select>
    </label>
  </div>
  <div class="row">
    <label>Search range (pt)<input type="number" id="searchPt" min="0" step="1" value="48"></label>
    <label>Match tolerance<input type="number" id="tol" min="0" max="100" step="1" value="25"></label>
  </div>
  <div class="row"><label class="inline"><input type="checkbox" id="aa" checked> Ignore anti-aliasing</label></div>
  <div class="row"><label class="inline"><input type="checkbox" id="ignMedia" checked> Ignore image/video layers</label></div>
</details>

<button class="primary" id="compareBtn" disabled>Compare</button>
<div id="status"></div>

<div id="results" class="hidden">
  <div class="card">
    <div id="summary"></div>
  </div>
  <div class="row">
    <button class="tab active" data-view="side">Side by side</button>
    <button class="tab" data-view="overlay">Overlay</button>
    <button class="tab" data-view="diff">Diff</button>
    <input type="range" id="opacity" min="0" max="1" step="0.01" value="0.5" class="hidden" style="flex:1">
  </div>
  <div id="previewWrap"><canvas id="preview"></canvas></div>
  <div id="regions"></div>
  <div id="ignored" class="hidden"></div>
  <div class="row" style="margin-top:8px;flex-wrap:wrap">
    <button id="markBtn">Mark on Figma</button>
    <button id="clearBtn">Clear marks</button>
    <button id="pngBtn">Export PNG</button>
    <button id="jsonBtn">Export JSON</button>
  </div>
</div>

<!-- Pure logic: no DOM access, testable in node -->
<script id="core">
(function (root) {
  'use strict';
  var MAX_DELTA = 35215; // max YIQ delta
  var MAX_REGIONS = 200;

  function blend(c, a) { return 255 + (c - 255) * a; }
  function rgb2y(r, g, b) { return r * 0.29889531 + g * 0.58662247 + b * 0.11448223; }
  function rgb2i(r, g, b) { return r * 0.59597799 - g * 0.2741761 - b * 0.32180189; }
  function rgb2q(r, g, b) { return r * 0.21147017 - g * 0.52261711 + b * 0.31114694; }

  // Signed YIQ delta between pixel k of a and pixel m of b (pixelmatch style)
  function colorDelta(a, b, k, m, yOnly) {
    var r1 = a[k], g1 = a[k + 1], b1 = a[k + 2], a1 = a[k + 3];
    var r2 = b[m], g2 = b[m + 1], b2 = b[m + 2], a2 = b[m + 3];
    if (a1 === a2 && r1 === r2 && g1 === g2 && b1 === b2) return 0;
    if (a1 < 255) { a1 /= 255; r1 = blend(r1, a1); g1 = blend(g1, a1); b1 = blend(b1, a1); }
    if (a2 < 255) { a2 /= 255; r2 = blend(r2, a2); g2 = blend(g2, a2); b2 = blend(b2, a2); }
    var y1 = rgb2y(r1, g1, b1), y2 = rgb2y(r2, g2, b2);
    var y = y1 - y2;
    if (yOnly) return y;
    var i = rgb2i(r1, g1, b1) - rgb2i(r2, g2, b2);
    var q = rgb2q(r1, g1, b1) - rgb2q(r2, g2, b2);
    var d = 0.5053 * y * y + 0.299 * i * i + 0.1957 * q * q;
    return y1 > y2 ? -d : d;
  }

  function sameRGBA(img, p, q) {
    return img[p] === img[q] && img[p + 1] === img[q + 1] && img[p + 2] === img[q + 2] && img[p + 3] === img[q + 3];
  }

  function hasManySiblings(img, x1, y1, w, h) {
    var x0 = Math.max(x1 - 1, 0), y0 = Math.max(y1 - 1, 0);
    var x2 = Math.min(x1 + 1, w - 1), y2 = Math.min(y1 + 1, h - 1);
    var pos = (y1 * w + x1) * 4;
    var zeroes = (x1 === x0 || x1 === x2 || y1 === y0 || y1 === y2) ? 1 : 0;
    for (var x = x0; x <= x2; x++) {
      for (var y = y0; y <= y2; y++) {
        if (x === x1 && y === y1) continue;
        if (sameRGBA(img, pos, (y * w + x) * 4)) zeroes++;
        if (zeroes > 2) return true;
      }
    }
    return false;
  }

  // Simplified pixelmatch anti-aliasing heuristic
  function antialiased(img, x1, y1, w, h, img2) {
    var x0 = Math.max(x1 - 1, 0), y0 = Math.max(y1 - 1, 0);
    var x2 = Math.min(x1 + 1, w - 1), y2 = Math.min(y1 + 1, h - 1);
    var pos = (y1 * w + x1) * 4;
    var zeroes = (x1 === x0 || x1 === x2 || y1 === y0 || y1 === y2) ? 1 : 0;
    var min = 0, max = 0, minX = 0, minY = 0, maxX = 0, maxY = 0;
    for (var x = x0; x <= x2; x++) {
      for (var y = y0; y <= y2; y++) {
        if (x === x1 && y === y1) continue;
        var d = colorDelta(img, img, pos, (y * w + x) * 4, true);
        if (d === 0) { zeroes++; if (zeroes > 2) return false; }
        else if (d < min) { min = d; minX = x; minY = y; }
        else if (d > max) { max = d; maxX = x; maxY = y; }
      }
    }
    if (min === 0 || max === 0) return false;
    return (hasManySiblings(img, minX, minY, w, h) && hasManySiblings(img2, minX, minY, w, h)) ||
           (hasManySiblings(img, maxX, maxY, w, h) && hasManySiblings(img2, maxX, maxY, w, h));
  }

  // A = design, B = screenshot ({width,height,data}), same size.
  function pixelDiff(A, B, opts) {
    var w = A.width, h = A.height, a = A.data, b = B.data;
    var t = opts.threshold, useAA = opts.antialias !== false;
    var maxD = MAX_DELTA * t * t;
    var out = new Uint8ClampedArray(w * h * 4);
    var changed = new Uint8Array(w * h);
    var diffCount = 0, aaCount = 0, ign = opts.ignoreMask || null;
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var idx = y * w + x, pos = idx * 4;
        if (ign && ign[idx]) {
          out[pos] = 220; out[pos + 1] = 235; out[pos + 2] = 255; out[pos + 3] = 255;
          continue;
        }
        var d = colorDelta(a, b, pos, pos, false);
        var r, g, bl;
        if (Math.abs(d) > maxD) {
          if (useAA && (antialiased(a, x, y, w, h, b) || antialiased(b, x, y, w, h, a))) {
            r = 255; g = 255; bl = 0; aaCount++;
          } else {
            r = 255; g = 0; bl = 0; changed[idx] = 1; diffCount++;
          }
        } else {
          var al = a[pos + 3] / 255;
          var v = blend(rgb2y(blend(a[pos], al), blend(a[pos + 1], al), blend(a[pos + 2], al)), 0.1);
          r = g = bl = v;
        }
        out[pos] = r; out[pos + 1] = g; out[pos + 2] = bl; out[pos + 3] = 255;
      }
    }
    return { diffImage: { width: w, height: h, data: out }, changed: changed, diffCount: diffCount, aaCount: aaCount };
  }

  function diffEvidence(diff, box, layout, padding) {
    var S = layout.scale, W = layout.W, H = layout.H;
    var left = Math.max(0, Math.floor((box.x - padding) * S));
    var top = Math.max(0, Math.floor((box.y - layout.designTopPt - padding) * S));
    var right = Math.min(W, Math.ceil((box.x + box.w + padding) * S));
    var bottom = Math.min(H, Math.ceil((box.y + box.h - layout.designTopPt + padding) * S));
    var count = 0, x0 = right, y0 = bottom, x1 = left, y1 = top;
    for (var y = top; y < bottom; y++) {
      for (var x = left; x < right; x++) {
        if (!diff.changed[y * W + x]) continue;
        count++;
        x0 = Math.min(x0, x); y0 = Math.min(y0, y);
        x1 = Math.max(x1, x + 1); y1 = Math.max(y1, y + 1);
      }
    }
    if (count < 3 * S * S) return null;
    return { x: x0 / S, y: y0 / S + layout.designTopPt, w: (x1 - x0) / S, h: (y1 - y0) / S };
  }

  function confirmLayoutIssues(issues, diff, layout) {
    var confirmed = [];
    issues.forEach(function (issue) {
      if (issue.kind !== 'content') {
        var actual = diffEvidence(diff, issue.actualBox, layout, issue.kind === 'spacing' ? 2 : 0);
        var evidence = actual || diffEvidence(diff, issue, layout, 2);
        if (!evidence) return;
        issue.diffBox = evidence;
        if (actual && issue.kind === 'size') issue.actualDiffBox = actual;
      }
      issue.index = confirmed.length + 1;
      confirmed.push(issue);
    });
    return confirmed;
  }

  function computeLayout(p) {
    var S = p.scale;
    var k = p.shotW / p.designW;              // device scale factor
    var shotScale = S / k;
    var W = Math.round(p.designW * S);
    var shotScaledH = Math.round(p.shotH * shotScale);
    var designPxH = p.designPxH || Math.round(p.designH * S);
    var sTop = Math.round(p.shotTopPt * S), sBot = Math.round(p.shotBotPt * S);
    var dTop = Math.round(p.designTopPt * S), dBot = Math.round(p.designBotPt * S);
    var Hs = Math.max(0, shotScaledH - sTop - sBot);
    var Hd = Math.max(0, designPxH - dTop - dBot);
    return {
      k: k, scale: S, W: W, H: Math.min(Hd, Hs), Hd: Hd, Hs: Hs,
      shotScaledH: shotScaledH, designPxH: designPxH,
      shotTop: sTop, designTop: dTop,
      designTopPt: p.designTopPt,
      heightMismatch: Math.abs(Hd - Hs) > S
    };
  }

  // ---- layer comparison ----
  var VECTOR_TYPES = ['VECTOR', 'BOOLEAN_OPERATION', 'STAR', 'LINE', 'ELLIPSE', 'POLYGON', 'RECTANGLE'];

  // children are parents-first, so one pass propagates ignore to descendants
  function effectiveIgnored(children, ignoreSet, ignoreMedia) {
    var out = new Set();
    for (var i = 0; i < children.length; i++) {
      var c = children[i];
      if ((ignoreSet && ignoreSet.has(c.id)) || (c.parentId && out.has(c.parentId)) || (ignoreMedia && c.media)) {
        out.add(c.id);
      }
    }
    return out;
  }

  function fillBox(mask, W, H, c, S, topPt, v) {
    var x0 = Math.max(0, Math.round(c.x * S)), y0 = Math.max(0, Math.round((c.y - topPt) * S));
    var x1 = Math.min(W, Math.round((c.x + c.w) * S)), y1 = Math.min(H, Math.round((c.y + c.h - topPt) * S));
    for (var y = y0; y < y1; y++) for (var x = x0; x < x1; x++) mask[y * W + x] = v;
  }

  // 1 = ignore. Ignored painting nodes mark their box, later opaque/text/vector nodes unmark it.
  function buildIgnoreMask(children, ignored, W, H, S, designTopPt) {
    var mask = new Uint8Array(W * H);
    for (var i = 0; i < children.length; i++) {
      var c = children[i];
      if (ignored.has(c.id)) {
        if (c.paints) fillBox(mask, W, H, c, S, designTopPt, 1);
      } else if (c.opaque || c.type === 'TEXT' || (VECTOR_TYPES.indexOf(c.type) >= 0 && c.type !== 'RECTANGLE')) {
        fillBox(mask, W, H, c, S, designTopPt, 0);
      }
    }
    return mask;
  }

  // RGBA image -> grayscale at 1pt resolution (S x S blocks averaged, alpha over white)
  function toGray(img, S) {
    var w1 = Math.floor(img.width / S), h1 = Math.floor(img.height / S);
    var g = new Float32Array(w1 * h1), d = img.data, n = S * S;
    var y, x;
    for (y = 0; y < h1; y++) {
      for (x = 0; x < w1; x++) {
        var sum = 0;
        for (var yy = 0; yy < S; yy++) {
          for (var xx = 0; xx < S; xx++) {
            var p = ((y * S + yy) * img.width + x * S + xx) * 4, al = d[p + 3] / 255;
            sum += 0.299 * blend(d[p], al) + 0.587 * blend(d[p + 1], al) + 0.114 * blend(d[p + 2], al);
          }
        }
        g[y * w1 + x] = sum / n;
      }
    }
    // 3x3 box blur: tolerate sub-pt rendering differences (fonts, JPEG, resampling)
    var b = new Float32Array(w1 * h1);
    for (y = 0; y < h1; y++) {
      for (x = 0; x < w1; x++) {
        var t = 0, k = 0;
        for (var oy = -1; oy <= 1; oy++) {
          for (var ox = -1; ox <= 1; ox++) {
            var X = x + ox, Y = y + oy;
            if (X >= 0 && Y >= 0 && X < w1 && Y < h1) { t += g[Y * w1 + X]; k++; }
          }
        }
        b[y * w1 + x] = t / k;
      }
    }
    return { w: w1, h: h1, g: b };
  }

  // Shape score 0..100 = (1 - NCC) * 100, plus mean brightness gap. Robust to tint/translucency.
  function nccScore(P, Q, px, py, pw, ph, qx, qy, step) {
    var n = 0, sp = 0, sq = 0, spp = 0, sqq = 0, spq = 0;
    for (var y = 0; y < ph; y += step) {
      var pi = (py + y) * P.w + px, qi = (qy + y) * Q.w + qx;
      for (var x = 0; x < pw; x += step) {
        var a = P.g[pi + x], c = Q.g[qi + x];
        sp += a; sq += c; spp += a * a; sqq += c * c; spq += a * c; n++;
      }
    }
    var vp = spp - sp * sp / n, vq = sqq - sq * sq / n;
    var ncc = (vp <= 0 || vq <= 0) ? 0 : (spq - sp * sq / n) / Math.sqrt(vp * vq);
    return { s: (1 - ncc) * 100, gap: Math.abs(sp - sq) / n };
  }

  function patchStd(P, bx) {
    var n = bx.w * bx.h, s = 0, s2 = 0;
    for (var y = bx.y; y < bx.y + bx.h; y++) {
      for (var x = bx.x; x < bx.x + bx.w; x++) { var v = P.g[y * P.w + x]; s += v; s2 += v * v; }
    }
    var m = s / n;
    return Math.sqrt(Math.max(0, s2 / n - m * m));
  }

  function fitsAt(Q, bx, dx, dy) {
    return bx.x + dx >= 0 && bx.y + dy >= 0 && bx.x + dx + bx.w <= Q.w && bx.y + dy + bx.h <= Q.h;
  }

  // Best offset among positions (list of [dx,dy]); tie-break toward center. null when nothing fits.
  function scan(P, Q, bx, positions, step, center) {
    var best = Infinity, cand = [];
    for (var i = 0; i < positions.length; i++) {
      var dx = positions[i][0], dy = positions[i][1];
      if (!fitsAt(Q, bx, dx, dy)) continue;
      var r = nccScore(P, Q, bx.x, bx.y, bx.w, bx.h, bx.x + dx, bx.y + dy, step);
      var s = r.s;
      cand.push({ dx: dx, dy: dy, s: s, gap: r.gap });
      if (s < best) best = s;
    }
    var pick = null, pd = Infinity;
    for (var j = 0; j < cand.length; j++) {
      if (cand[j].s > best + 1) continue;
      var dist = Math.abs(cand[j].dx - center.dx) + Math.abs(cand[j].dy - center.dy);
      if (dist < pd || (dist === pd && cand[j].s < pick.s)) { pd = dist; pick = cand[j]; }
    }
    return pick;
  }

  function grid(cx, cy, rx, ry, step) {
    var out = [];
    for (var dy = cy - ry; dy <= cy + ry; dy += step) {
      for (var dx = cx - rx; dx <= cx + rx; dx += step) out.push([dx, dy]);
    }
    return out;
  }

  function classifyLayers(children, byId) {
    var roles = {}, excluded = {}, boundaries = new Set();
    var data = /(?:^|[\s_/.-])(?:list|data[- _]?row|table|cell|repeater|collection|beneficiary[- _]?row|danh sách|dòng dữ liệu)(?:$|[\s_/.-])/i;
    var heading = /\b(?:title|heading|headline)\b|tiêu đề/i;
    var secondary = /\b(?:subtitle|description|caption|helper|footnote|placeholder|body|metadata|supporting|secondary)\b|mô tả|chú thích/i;
    var button = /\b(?:button|btn|cta)\b|nút/i;
    var icon = /\b(?:icon|glyph|pictogram|shortcut)\b|biểu tượng/i;
    var rowGroups = new Map(), repeatedRows = new Set();

      var designCv = canvasOf(L.W, L.H), shotCv = canvasOf(L.W, L.H);
      designCv.getContext('2d').drawImage(fullD, 0, 0);
      shotCv.getContext('2d').drawImage(fullS, 0, 0);

      state.ignoreIds = (exp.ignoreIds || []).slice();
      state.ignoreNames = {};
      exp.children.forEach(function (c) { state.ignoreNames[c.id] = c.name; });
      state.base = {
        exp: exp, L: L, o: o, crop: crop, shot: shot, fullD: fullD, fullS: fullS, designCv: designCv, shotCv: shotCv,
        dData: imgData(designCv), sData: imgData(shotCv)
      };
      analyze();
      setStatus('');
    } catch (e) {
      setStatus(e.message || String(e), true);
    } finally {
      state.busy = false; updateCompare();
    }
  }
  $('compareBtn').onclick = compare;

  // Everything that depends on the ignore list; reuses the exported images
  function analyze() {
    var b = state.base;
    if (!b) return;
    var L = b.L, o = b.o, S = o.scale, children = b.exp.children;
    var ignored = DiffCore.effectiveIgnored(children, new Set(state.ignoreIds), o.ignoreMedia);
    var byId = {};
    children.forEach(function (c) { byId[c.id] = c; });
    var classification = DiffCore.classifyLayers(children, byId);
    ignored.forEach(function (id) { classification.boundaries.delete(id); });
    children.forEach(function (c) { if (classification.excluded[c.id]) ignored.add(c.id); });
    var mask = DiffCore.buildIgnoreMask(children, ignored, L.W, L.H, S, L.designTopPt);
    var diff = DiffCore.pixelDiff(b.dData, b.sData, { threshold: o.threshold, antialias: o.antialias, ignoreMask: mask });
    var diffCv = canvasOf(L.W, L.H);
    diffCv.getContext('2d').putImageData(new ImageData(diff.diffImage.data, L.W, L.H), 0, 0);
    var list = DiffCore.layerCompare(imgData(b.fullD), imgData(b.fullS), {
      scale: S, designTopPt: L.designTopPt, children: children, ignored: ignored,
      roles: classification.roles, boundaries: classification.boundaries,
      searchPt: o.searchPt, tolerance: o.tolerance
    }).issues;
    state.res = {
      W: L.W, H: L.H, S: S, layout: L, list: DiffCore.confirmLayoutIssues(list, diff, L), opts: o, crop: b.crop, node: b.exp.node,
      diffPercent: diff.diffCount / Math.max(1, L.W * L.H - countOnes(mask)) * 100, designCv: b.designCv, shotCv: b.shotCv, diffCv: diffCv
    };
    showResults();
  }
  function countOnes(m) { var n = 0; for (var i = 0; i < m.length; i++) n += m[i]; return n; }

  function setIgnore(ids) {
    state.ignoreIds = ids;
    post({ type: 'set-ignore', ids: ids });
    analyze();
  }

  // ---- results ----
  function fmt(n) { return (Math.round(n * 10) / 10).toString(); }

  function issueNote(g) {
    if (g.kind === 'spacing') return 'Sai spacing - spacing gốc ' + fmt(g.designGap) + ' px';
    if (g.kind === 'content') return 'Kiểm tra nội dung tiêu đề - nội dung gốc “' + g.label + '”';
    if (g.kind === 'icon') return 'Sai UI icon - đối chiếu hình dạng, nét hoặc màu với ' + g.label + ' trong Figma';
    var dimensions = fmt(g.w) + ' × ' + fmt(g.h) + ' px';
    if (g.metric === 'fontSize') dimensions = 'cỡ chữ ' + fmt(g.fontSize) + ' px';
    if (g.metric === 'fontWeight') dimensions = 'độ đậm ' + g.fontWeight;
    return 'Sai kích thước ' + g.label + ' - kích thước gốc ' + dimensions;
  }

  function showResults() {
    var r = state.res;
    $('results').classList.remove('hidden');
    var counts = { spacing: 0, size: 0, content: 0, icon: 0 };
    r.list.forEach(function (g) { counts[g.kind]++; });
    $('summary').textContent = counts.spacing + ' spacing · ' + counts.size + ' kích thước · ' +
      counts.icon + ' UI icon · ' + counts.content + ' nội dung';
    var box = $('regions');
    box.textContent = '';
    r.list.forEach(function (g) {
      var d = document.createElement('div'), t = document.createElement('span');
      d.className = 'reg'; t.className = 't';
      var dot = document.createElement('span');
      dot.className = 'dot ' + g.kind;
      d.appendChild(dot);
      t.textContent = '#' + g.index + ' · ' + issueNote(g) + (g.kind === 'spacing' ? ' · ' + g.label : '');
      d.appendChild(t);
      if (g.nodeId) {
        var ig = document.createElement('button');
        ig.className = 'ig'; ig.textContent = 'Ignore';
        ig.onclick = function (e) {
          e.stopPropagation();
          if (state.ignoreIds.indexOf(g.nodeId) < 0) setIgnore(state.ignoreIds.concat([g.nodeId]));
        };
        d.appendChild(ig);
      }
      d.onclick = function () {
        if (g.nodeId) post({ type: 'focus-node', nodeId: g.nodeId });
        else post({ type: 'focus-region', x: g.x, y: g.y, w: g.w, h: g.h });
      };
      d.onmouseenter = function () { state.hover = g.index; drawPreview(); };
      d.onmouseleave = function () { state.hover = -1; drawPreview(); };
      box.appendChild(d);
    });
    var chips = $('ignored');
    chips.textContent = '';
    chips.classList.toggle('hidden', !state.ignoreIds.length);
    if (state.ignoreIds.length) {
      var lb = document.createElement('span');
      lb.className = 'muted'; lb.textContent = 'Ignored:';
      chips.appendChild(lb);
      state.ignoreIds.forEach(function (id) {
        var c = document.createElement('span'), n = document.createElement('span'), x = document.createElement('button');
        c.className = 'chip'; n.textContent = state.ignoreNames[id] || id; x.textContent = '×';
        x.onclick = function () { setIgnore(state.ignoreIds.filter(function (v) { return v !== id; })); };
        c.appendChild(n); c.appendChild(x); chips.appendChild(c);
      });
    }
    drawPreview();
  }

  // Convert a box in design units to working pixels.
  function boxOf(r, b) {
    var S = r.S;
    return { x: b.x * S, y: (b.y - r.layout.designTopPt) * S, w: b.w * S, h: b.h * S };
  }

  function drawBoxes(ctx, r, ox, sc, hover, source) {
    ctx.font = 'bold 11px sans-serif'; ctx.textBaseline = 'top';
    r.list.forEach(function (g) {
      var region = source === 'diff' ? g.diffBox || g : source === 'actual' ? g.highlightBox || g.actualBox : g;
      var b = boxOf(r, region), x = ox + b.x * sc, y = b.y * sc, w = b.w * sc, h = b.h * sc;
      var on = g.index === hover;
      var col = g.kind === 'size' ? '#0d99ff' : g.kind === 'spacing' ? '#ff0000' : '#ff2d55';
      ctx.lineWidth = on ? 3 : 1.5;
      ctx.strokeStyle = on ? '#0d99ff' : col;
      ctx.fillStyle = g.kind === 'size' ? 'rgba(13,153,255,.5)' : on ? 'rgba(13,153,255,.25)' : col + '22';
      ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);
      var t = '' + g.index, tw = ctx.measureText(t).width + 6;
      ctx.fillStyle = on ? '#0d99ff' : col;
      ctx.fillRect(x, y, tw, 14);
      ctx.fillStyle = '#fff'; ctx.fillText(t, x + 3, y + 2);
    });
  }

  function drawPreview() {
    var r = state.res;
    if (!r) return;
    var cv = $('preview'), side = state.view === 'side', gap = 8;
    var totalW = side ? r.W * 2 + gap : r.W;
    var avail = $('previewWrap').clientWidth || 380;
    var sc = avail / totalW;
    cv.width = Math.max(1, Math.round(totalW * sc));
    cv.height = Math.max(1, Math.round(r.H * sc));
    var ctx = cv.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    var w = r.W * sc, h = r.H * sc;
    if (side) {
      ctx.drawImage(r.designCv, 0, 0, w, h);
      ctx.drawImage(r.shotCv, (r.W + gap) * sc, 0, w, h);
      drawBoxes(ctx, r, 0, sc, state.hover, 'design');
      drawBoxes(ctx, r, (r.W + gap) * sc, sc, state.hover, 'actual');
    } else if (state.view === 'overlay') {
      ctx.drawImage(r.designCv, 0, 0, w, h);
      ctx.globalAlpha = parseFloat($('opacity').value);
      ctx.drawImage(r.shotCv, 0, 0, w, h);
      ctx.globalAlpha = 1;
      drawBoxes(ctx, r, 0, sc, state.hover, 'design');
    } else {
      ctx.drawImage(r.diffCv, 0, 0, w, h);
      drawBoxes(ctx, r, 0, sc, state.hover, 'diff');
    }
  }

  document.querySelectorAll('button.tab').forEach(function (b) {
    b.onclick = function () {
      state.view = b.getAttribute('data-view');
      document.querySelectorAll('button.tab').forEach(function (x) { x.classList.toggle('active', x === b); });
      $('opacity').classList.toggle('hidden', state.view !== 'overlay');
      drawPreview();
    };
  });
  $('opacity').oninput = drawPreview;
  window.addEventListener('resize', drawPreview);

  // ---- actions ----
  function annotationIssues(issues) {
    var notes = [];
    issues.forEach(function (issue) {
      var box = issue.actualBox;
      var note = issueNote(issue);
      var isIcon = issue.kind === 'icon' || (issue.kind === 'size' && issue.role === 'icon');
      var sameRow = isIcon && notes.find(function (entry) {
        if (!entry.isIcon || entry.note !== note) return false;
        var other = entry.issue.actualBox;
        var overlap = Math.min(box.y + box.h, other.y + other.h) - Math.max(box.y, other.y);
        return overlap >= Math.min(box.h, other.h) * 0.5;
      });
      if (sameRow) {
        sameRow.count++;
      } else {
        notes.push({ issue: issue, isIcon: isIcon, note: note, count: 1 });
      }
    });
    return notes;
  }

  $('markBtn').onclick = async function () {
    var r = state.res, b = state.base;
    if (!r || !b || state.busy) return;
    var btn = $('markBtn');
    state.busy = true;
    updateCompare();
    btn.disabled = true;
    try {
      var cv = canvasOf(r.W, r.layout.shotScaledH);
      cv.getContext('2d').drawImage(b.shot.img, 0, 0, cv.width, cv.height);
      var blob = await new Promise(function (resolve) { cv.toBlob(resolve, 'image/png'); });
      if (!blob) throw new Error('Không thể xuất ảnh Actual UI');
      var top = r.layout.shotTop / r.S;
      var annotations = annotationIssues(r.list);
      await request({
        type: 'mark', nodeId: r.node.id, bytes: new Uint8Array(await blob.arrayBuffer()),
        width: cv.width / r.S, height: cv.height / r.S,
        regions: annotations.map(function (entry) {
          var g = entry.issue;
          var anchor = g.actualDiffBox || g.actualBox;
          var b = boxOf(r, g.highlightBox || anchor);
          var x0 = Math.max(0, b.x / r.S), y0 = Math.max(0, b.y / r.S + top);
          var x1 = Math.min(cv.width / r.S, (b.x + b.w) / r.S);
          var y1 = Math.min(cv.height / r.S, (b.y + b.h) / r.S + top);
          var box = x1 > x0 && y1 > y0 ? { x: x0, y: y0, w: x1 - x0, h: y1 - y0 } : null;
          var note = entry.note + (g.kind === 'spacing' ? '\n' + g.label : '');
          if (entry.count > 1) note += '\n' + entry.count + ' icon trong hàng cùng lỗi';
          return {
            index: g.index, x: anchor.x + anchor.w / 2,
            y: anchor.y + anchor.h / 2 - r.layout.designTopPt + top,
            kind: g.kind, box: box, note: note
          };
        })
      }, 'marked');
      setStatus('Đã tạo ' + annotations.length + ' ghi chú trên Actual UI');
    } catch (e) {
      setStatus(e.message, true);
    } finally {
      state.busy = false;
      updateCompare();
      btn.disabled = false;
    }
  };
  $('clearBtn').onclick = function () { post({ type: 'clear-marks' }); };

  function download(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  function baseName() { return ((state.res && state.res.node.name) || 'diff').replace(/[^\w.-]+/g, '_'); }

  $('pngBtn').onclick = function () {
    var r = state.res;
    if (!r) return;
    var cv = canvasOf(r.W, r.H), ctx = cv.getContext('2d');
    ctx.drawImage(r.diffCv, 0, 0);
    drawBoxes(ctx, r, 0, 1, -1, 'diff');
    cv.toBlob(function (b) { if (b) download(b, baseName() + '-diff.png'); }, 'image/png');
  };
  $('jsonBtn').onclick = function () {
    var r = state.res;
    if (!r) return;
    var report = {
      node: r.node, ignoredIds: state.ignoreIds, settings: r.opts, crop: r.crop,
      screenshot: { width: state.base.shot.w, height: state.base.shot.h, name: state.base.shot.name, deviceScale: r.layout.k },
      diffPercent: r.diffPercent,
      heightMismatch: r.layout.heightMismatch
        ? { designPt: r.layout.Hd / r.S, uiPt: r.layout.Hs / r.S } : false,
      regions: r.list.map(function (g) {
        var o = {
          index: g.index, x: g.x, y: g.y, w: g.w, h: g.h, label: g.label,
          node: g.nodeId ? { id: g.nodeId, name: g.nodeName, type: g.nodeType } : null
        };
        o.kind = g.kind;
        o.note = issueNote(g);
        o.actualBox = g.actualBox;
        if (g.diffBox) o.diffBox = g.diffBox;
        if (g.kind === 'spacing') { o.axis = g.axis; o.designGap = g.designGap; o.actualGap = g.actualGap; }
        if (g.kind === 'size') { o.metric = g.metric; o.fontSize = g.fontSize; o.fontWeight = g.fontWeight; }
        return o;
      })
    };
    download(new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' }), baseName() + '-diff.json');
  };
})();
</script>
</body>
</html>
